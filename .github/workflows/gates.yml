name: gates

# Offline gate suite for the Godot project. The suite never touches the live
# Talo account: run_gates.sh exports KIEPIE_MOCK_BACKEND=1 and backend gates
# hard-abort without it. Do NOT add a real key here — ever.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Godot 4.3 + system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xkb-utils libgl1 libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 unzip curl ca-certificates
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          echo "fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a  /tmp/godot.zip" | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot-4.3
          godot-4.3 --version

      - name: Run gates (27 total incl. GdUnit4, scene_sync, xvfb multi-touch)
        run: bash godot/tools/run_gates.sh
        env:
          KIEPIE_MOCK_BACKEND: "1"
